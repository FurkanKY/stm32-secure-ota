name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ARM_GCC_RELEASE: "14.2.Rel1"
  RENODE_VERSION: "1.16.0"

jobs:
  python:
    name: Host tool (otatool)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/pyproject.toml
      - run: pip install -e "tools[test,can]"
      - run: pytest tools -v
      - name: Test vectors match otatool
        run: |
          python tools/gen_test_vectors.py
          git diff --exit-code -- test/vectors

  host-tests:
    name: Boot core unit tests (${{ matrix.cc }}, ASan + UBSan)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: >
          cmake -S . -B build/host -G Ninja
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DSOTA_HOST_TESTS=ON -DSOTA_SANITIZE=ON
      - run: cmake --build build/host
      - run: ctest --test-dir build/host --output-on-failure

  firmware:
    name: Firmware (arm-none-eabi-gcc)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/pyproject.toml
      - run: pip install -e tools
      - uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: ${{ env.ARM_GCC_RELEASE }}
      - run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build bootloader and signed demo apps
        run: |
          cmake -S . -B build/fw -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake
          cmake --build build/fw
      - name: Size report
        run: |
          {
            echo "### Firmware size"
            echo '```'
            arm-none-eabi-size build/fw/boot/sota_boot.elf build/fw/app/app_v1_a.elf
            echo '```'
            boot=$(arm-none-eabi-size -A build/fw/boot/sota_boot.elf | awk '$1==".isr_vector"||$1==".text"||$1==".data"{s+=$2} END{print s}')
            echo "Bootloader flash use: **${boot} bytes** of 32768 ($((boot * 100 / 32768))%)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            build/fw/boot/sota_boot.elf
            build/fw/boot/sota_boot.bin
            build/fw/boot/sota_boot.map
            build/fw/gateway/sota_gateway.elf
            build/fw/app/*.signed.bin
            build/fw/flash_erased.bin
          if-no-files-found: error

  simulation:
    name: Renode end-to-end tests
    needs: firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/pyproject.toml
      - run: pip install -e "tools[test]"
      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: build/fw
      - name: Install Renode ${{ env.RENODE_VERSION }}
        run: |
          mkdir -p "$RUNNER_TEMP/renode"
          curl -fsSL "https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable-dotnet.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/renode"
          renode=$(find "$RUNNER_TEMP/renode" -maxdepth 2 -type f -name renode | head -n 1)
          test -x "$renode"
          echo "RENODE=$renode" >> "$GITHUB_ENV"
      - run: pytest sim --build build/fw -v
      - name: Keep Renode logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: renode-logs
          path: build/fw/renode-*.log
